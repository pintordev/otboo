name: CI (PR)

on:
  pull_request_target:
    branches: [ dev, main ]
    types: [ opened, synchronize, reopened ]

permissions: { }

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  filter:
    name: Filter changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.f.outputs.src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: f
        with:
          filters: |
            src:
              - '**/*.java'
              - '**/*.gradle'
              - 'src/**'

  test:
    name: Run tests
    needs: filter
    if: needs.filter.outputs.src == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # v7부터 pull_request_target에서 fork PR 코드 체크아웃이 기본 차단됨.
          # 팀 내부 fork만 쓰고 노출 시크릿도 S3 설정 다운로드용뿐이라 의도적으로 허용(28행 근거 참고).
          allow-unsafe-pr-checkout: true

      - name: Set up JDK 17 (Corretto)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download config files from S3
        run: |
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/config/test/application.yaml src/main/resources/application.yaml
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/config/test/application-test.yaml src/test/resources/application-test.yaml

      - name: Start Elasticsearch
        run: |
          docker build -t otboo-es docker/elasticsearch
          docker run -d --name otboo-es -p 9200:9200 \
            -e "discovery.type=single-node" \
            -e "xpack.security.enabled=false" \
            -e "ES_JAVA_OPTS=-Xms512m -Xmx512m" \
            otboo-es
          timeout 180 sh -c '
            until curl --silent --show-error --fail \
                "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" \
                | jq -e ".timed_out == false" >/dev/null; do
              sleep 3
            done
          '

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests and check coverage gate (80%)
        run: ./gradlew test jacocoTestCoverageVerification

      - name: Upload jacoco report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: |
            build/reports/jacoco/test/jacocoTestReport.xml
            build/reports/jacoco/test/html/
            build/reports/tests/test/
          retention-days: 7

  skip:
    name: Skip CI
    needs: filter
    if: needs.filter.outputs.src != 'true'
    runs-on: ubuntu-latest
    permissions: { }
    steps:
      - name: CI skipped
        run: echo "CI skipped — no code changes"

  result:
    name: CI Result
    needs: [ filter, test, skip ]
    if: always()
    runs-on: ubuntu-latest
    permissions: { }
    steps:
      - name: Check CI result
        run: |
          if [[ "${{ needs.filter.result }}" != "success" ]] ||
             [[ "${{ needs.test.result }}" == "failure" || "${{ needs.test.result }}" == "cancelled" ]] ||
             [[ "${{ needs.skip.result }}" == "failure" || "${{ needs.skip.result }}" == "cancelled" ]] ||
             { [[ "${{ needs.test.result }}" != "success" ]] && [[ "${{ needs.skip.result }}" != "success" ]]; }; then
            exit 1
          fi
