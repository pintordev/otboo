events {
}

http {
    # 실제 ALB가 여러 태스크로 트래픽을 분산하는 모양을 로컬에서 흉내낸다(app-1/app-2는 8080/8081로 개별 접근도 계속 가능)
    upstream otboo_app {
        server app-1:8080 max_fails=3 fail_timeout=30s;
        server app-2:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;   # 업스트림 커넥션 재사용 — 매 요청마다 새 TCP 연결 안 맺음
    }

    # WebSocket 업그레이드 요청에만 Connection: upgrade를 전달, 일반 요청은 그대로 close(표준 nginx WS 프록시 패턴)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # upstream_addr을 access log에 남겨 라운드로빈이 실제로 app-1/app-2를 번갈아 타는지 확인 가능
    log_format otboo_upstream '$remote_addr - [$time_local] "$request" $status '
                               'upstream_addr="$upstream_addr" '
                               'upstream_status="$upstream_status" '
                               'upstream_response_time="$upstream_response_time" '
                               'request_time="$request_time"';

    server {
        listen 80;
        client_max_body_size 10m;   # 앱의 이미지 업로드 제한(5MB)보다 넉넉하게 — nginx 기본값(1MB)이면 업로드가 앱까지 못 감
        access_log /var/log/nginx/access.log otboo_upstream;

        # 기본값(connect/read 60s, next_upstream_timeout 0=무제한)이면 죽은 인스턴스 만날 때 최대 180초까지 요청이 붙잡힘 —
        # WebSocket/SSE는 각 location에서 이 값을 3600s로 재정의해 장시간 연결을 그대로 허용
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_next_upstream_timeout 15s;

        location / {
            proxy_pass http://otboo_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        location ~ ^/ws(?:/|$) {
            proxy_pass http://otboo_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
        }

        location = /api/sse {
            proxy_pass http://otboo_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }
    }
}