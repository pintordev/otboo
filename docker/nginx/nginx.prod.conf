worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
}

http {
    # upstream 멤버는 nginx-watcher.sh가 Cloud Map(discover-instances) 결과로 재생성한다 —
    # 나머지 구조는 docker/nginx/nginx.conf(로컬)와 동일하게 유지한다.
    # BEGIN_UPSTREAM
    upstream otboo_app {
        server 127.0.0.1:8080 down;   # placeholder — nginx-entrypoint.sh가 nginx 기동 전에 실제 인스턴스로 덮어쓴다(Cloud Map 조회가 끝내 실패한 경우에만 이 값으로 남는다)
        keepalive 32;
    }
    # END_UPSTREAM

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    log_format otboo_upstream '$remote_addr - [$time_local] "$request" $status '
                               'upstream_addr="$upstream_addr" '
                               'upstream_status="$upstream_status" '
                               'upstream_response_time="$upstream_response_time" '
                               'request_time="$request_time"';

    server {
        listen 80;
        client_max_body_size 10m;
        access_log /var/log/nginx/access.log otboo_upstream;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_next_upstream_timeout 40s;   # read_timeout(15s) × tries(3) 이상으로 잡아야 재시도가 타임아웃 전에 실제로 끝까지 발동함

        location / {
            proxy_pass http://otboo_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Otboo-Request-Id $request_id;

            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        location ~ ^/ws(?:/|$) {
            proxy_pass http://otboo_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Otboo-Request-Id $request_id;

            proxy_read_timeout 3600s;
        }

        location = /api/sse {
            proxy_pass http://otboo_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Otboo-Request-Id $request_id;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }
    }
}